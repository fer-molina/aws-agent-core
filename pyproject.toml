[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "CustomerSupport"
version = "0.1.0"
description = "AgentCore Runtime Application using Strands SDK"
requires-python = ">=3.12"
dependencies = [
    "aws-opentelemetry-distro ~= 0.21.0",
    "bedrock-agentcore >= 1.18.1, < 2.0.0",
    "botocore[crt] >= 1.35.0",
    "mcp~=1.24.0",
    "strands-agents >= 1.15.0, < 2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
